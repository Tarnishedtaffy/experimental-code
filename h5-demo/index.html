<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>H5 移动端演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; max-width: 480px; margin: 0 auto; min-height: 100vh; }

  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #4f6ef7, #6a5cf5); color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; }

  .banner { margin: 12px; border-radius: 12px; background: linear-gradient(120deg, #4f6ef7, #8f5cf5); color: #fff; padding: 22px 18px; }
  .banner h2 { font-size: 20px; margin-bottom: 6px; }
  .banner p { font-size: 13px; opacity: .85; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px; }
  .entry { background: #fff; border-radius: 12px; padding: 12px 4px; text-align: center; font-size: 12px; color: #444; }
  .entry .icon { width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }

  .section-title { margin: 16px 16px 8px; font-size: 15px; font-weight: 600; color: #222; }

  .card { display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 12px; margin: 0 12px 10px; align-items: center; }
  .card .cover { width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; }
  .card .info { flex: 1; min-width: 0; }
  .card .info h3 { font-size: 15px; color: #222; margin-bottom: 4px; }
  .card .info p { font-size: 12px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .price { color: #f55; font-weight: 700; font-size: 16px; margin-top: 4px; }
  .card .price small { font-size: 11px; font-weight: 400; color: #999; margin-left: 6px; text-decoration: line-through; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; display: flex; border-top: 1px solid #eee; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  nav a { flex: 1; text-align: center; font-size: 11px; color: #999; text-decoration: none; }
  nav a.active, nav a:active { color: #4f6ef7; }
  nav .n-icon { font-size: 20px; display: block; margin-bottom: 2px; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  body { padding-bottom: 70px; }
</style>
</head>
<body>

<header>H5 移动端演示</header>

<div class="banner">
  <h2>欢迎回来 👋</h2>
  <p>这是一个纯 HTML/CSS/JS 的移动端页面示例</p>
</div>

<div class="grid" id="grid"></div>

<div class="section-title">猜你喜欢</div>
<div id="list"></div>

<nav>
  <a href="#" class="active"><span class="n-icon">🏠</span>首页</a>
  <a href="#" onclick="toast('分类页面占位');return false"><span class="n-icon">🗂️</span>分类</a>
  <a href="#" onclick="toast('购物车页面占位');return false"><span class="n-icon">🛒</span>购物车</a>
  <a href="#" onclick="toast('我的页面占位');return false"><span class="n-icon">👤</span>我的</a>
</nav>

<div class="toast" id="toast"></div>

<script>
  const entries = [
    { icon: '📦', label: '全部订单', bg: '#4f6ef7' },
    { icon: '🎁', label: '领福利',   bg: '#f5726a' },
    { icon: '🎫', label: '优惠券',   bg: '#f7a44f' },
    { icon: '⚙️', label: '设置',     bg: '#5cc49a' },
  ];
  document.getElementById('grid').innerHTML = entries.map((e, i) =>
    `<div class="entry" onclick="toast('点击了「${e.label}」')">
       <div class="icon" style="background:${e.bg}18">${e.icon}</div>${e.label}
     </div>`).join('');

  const goods = [
    { emoji: '🎧', name: '无线蓝牙耳机 Pro', desc: '主动降噪 · 40小时续航', price: 299, old: 399, bg: '#6a5cf5' },
    { emoji: '⌚', name: '智能手表 S2',      desc: '心率监测 · 运动记录', price: 499, old: 699, bg: '#4f9df7' },
    { emoji: '🔊', name: '便携蓝牙音箱',     desc: '重低音 · IPX7防水',   price: 159, old: 219, bg: '#f5726a' },
    { emoji: '💡', name: '智能氛围灯带',     desc: '1600万色 · 语音控制', price: 79,  old: 99,  bg: '#5cc49a' },
  ];
  document.getElementById('list').innerHTML = goods.map(g =>
    `<div class="card" onclick="toast('点击了「${g.name}」')">
       <div class="cover" style="background:${g.bg}">${g.emoji}</div>
       <div class="info">
         <h3>${g.name}</h3>
         <p>${g.desc}</p>
         <div class="price">¥${g.price}<small>¥${g.old}</small></div>
       </div>
     </div>`).join('');

  let timer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => t.classList.remove('show'), 1500);
  }
</script>
</body>
</html>
